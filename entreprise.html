<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profil professionnel — MALAGA</title>
  <meta name="theme-color" content="#009E60">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&family=Playfair+Display:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    .ent-hero{max-width:1000px;margin:0 auto;padding:24px 20px 4px;}
    .ent-carte{background:linear-gradient(135deg,var(--vert) 0%,var(--vert-fonce) 100%);border-radius:18px;
      padding:24px 20px;color:#fff;display:flex;align-items:center;gap:16px;box-shadow:0 6px 20px rgba(0,62,40,.18);}
    .ent-logo{width:74px;height:74px;border-radius:16px;background:rgba(255,255,255,.18);
      display:flex;align-items:center;justify-content:center;font-size:30px;overflow:hidden;flex-shrink:0;
      border:3px solid rgba(255,255,255,.4);}
    .ent-logo img{width:100%;height:100%;object-fit:cover;}
    .ent-infos{min-width:0;flex:1;}
    .ent-nom{font-size:19px;font-weight:800;font-family:'Playfair Display',serif;line-height:1.25;}
    .ent-badge{display:inline-flex;align-items:center;gap:4px;margin-top:6px;font-size:11px;font-weight:800;
      background:rgba(255,255,255,.2);padding:3px 10px;border-radius:20px;letter-spacing:.3px;}
    .ent-slogan{margin-top:6px;font-size:12.5px;opacity:.92;font-style:italic;}
    .ent-contact{margin-top:10px;font-size:12.5px;opacity:.92;line-height:1.7;}

    .ent-stats{max-width:1000px;margin:16px auto 0;padding:0 20px;display:grid;grid-template-columns:repeat(2,1fr);gap:10px;}
    .stat-carte{background:#fff;border:1px solid var(--gris-bordure);border-radius:14px;padding:14px 8px;text-align:center;}
    .stat-carte .n{font-size:19px;font-weight:800;color:var(--vert);}
    .stat-carte .l{font-size:10.5px;color:var(--gris-clair);margin-top:2px;font-weight:600;}

    .ent-section{max-width:1000px;margin:26px auto 0;padding:0 20px 30px;}
    .ent-section h2{font-size:15.5px;font-weight:800;color:var(--texte);margin-bottom:12px;}

    /* ===== Localisation ===== */
    .loc-carte{width:100%;height:220px;border-radius:14px;overflow:hidden;border:1px solid var(--gris-bordure);margin-bottom:12px;}
    .loc-actions{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
    @media(max-width:480px){.loc-actions{grid-template-columns:1fr;}}
    .loc-btn{display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;
      background:#fff;border:1.5px solid var(--gris-bordure);border-radius:12px;padding:12px 8px;
      text-decoration:none;color:var(--texte);font-size:11.5px;font-weight:700;transition:border-color .15s,background .15s;}
    .loc-btn:hover{border-color:var(--vert);background:rgba(0,158,96,.05);}
    .loc-btn .icone{font-size:20px;}

    .mini-grille{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px;}
    .mini-carte{background:#fff;border:1px solid var(--gris-bordure);border-radius:14px;overflow:hidden;cursor:pointer;
      transition:box-shadow .15s ease;}
    .mini-carte:hover{box-shadow:0 4px 14px rgba(0,0,0,.08);}
    .mini-carte .img{height:130px;background:var(--gris-fond);display:flex;align-items:center;justify-content:center;font-size:30px;}
    .mini-carte .img img{width:100%;height:100%;object-fit:cover;}
    .mini-carte .corps{padding:10px 12px 12px;}
    .mini-carte h4{font-size:13px;font-weight:700;line-height:1.3;margin-bottom:4px;
      display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
    .mini-carte .prix{font-size:13px;font-weight:800;color:var(--vert);}
    .mini-carte .meta{font-size:10.5px;color:var(--gris-clair);margin-top:2px;}
  </style>
</head>
<body>

  <div class="drawer-overlay" id="drawerOverlay"></div>
  <aside class="drawer" id="drawer">
    <div class="drawer-header">
      <img src="img/logo.png" alt="MALAGA" class="drawer-logo">
      <button class="drawer-close" id="fermerDrawer">✕</button>
    </div>
    <nav class="drawer-nav">
      <a href="index.html" class="drawer-link">🏠 Accueil</a>
      <a href="index.html#liste-annonces" class="drawer-link">📋 Toutes les annonces</a>
      <div class="drawer-sep"></div>
      <a href="tel:+24160141924" class="drawer-link">📞 Nous appeler</a>
      <a href="https://wa.me/24160141924" target="_blank" class="drawer-link">💬 WhatsApp</a>
      <div class="drawer-sep"></div>
      <a href="connexion.html" class="drawer-link" id="drawerConnexion">👤 Se connecter</a>
    </nav>
    <div class="drawer-footer">MALAGA 🇬🇦 — Libreville, Gabon</div>
  </aside>

  <header class="header">
    <div class="header-inner">
      <button class="icon-btn" id="btnMenu" aria-label="Menu">☰</button>
      <a href="index.html" class="logo-link">
        <img src="img/logo.png" alt="MALAGA" class="logo-img">
        <span class="logo-text-wrap">
          <span class="logo-text">MALAGA</span>
          <span class="slogan">Maison à louer au Gabon 🇬🇦</span>
        </span>
      </a>
      <a href="index.html" class="icon-btn" aria-label="Accueil">🏠</a>
    </div>
  </header>

  <!-- ===== EN-TÊTE VITRINE ===== -->
  <div class="ent-hero">
    <div class="ent-carte" id="entCarte">
      <div class="ent-logo" id="entLogo">🏢</div>
      <div class="ent-infos">
        <div class="ent-nom" id="entNom">Chargement…</div>
        <div id="entBadgeWrap"></div>
        <div class="ent-slogan" id="entSlogan" style="display:none;"></div>
        <div class="ent-contact" id="entContact"></div>
      </div>
    </div>
  </div>

  <div class="ent-stats">
    <div class="stat-carte"><div class="n" id="statBiens">0</div><div class="l">🏘️ Biens publiés</div></div>
    <div class="stat-carte"><div class="n" id="statDisponibles">0</div><div class="l">🟢 Disponibles</div></div>
  </div>

  <div class="ent-section" id="sectionLocalisation" style="display:none;">
    <h2>📍 Nous trouver</h2>
    <div class="loc-carte" id="locCarte"></div>
    <div class="loc-actions" id="locActions"></div>
  </div>

  <div class="ent-section">
    <h2>📋 Catalogue de biens</h2>
    <div class="mini-grille" id="listeBiens">
      <div class="spinner">Chargement…</div>
    </div>
  </div>

  <footer class="footer">
    <div class="brand">MALAGA 🇬🇦</div>
    <p>📞 +241 60 14 19 24 &nbsp;|&nbsp; ✉️ malagagabon@gmail.com</p>
  </footer>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script type="module">
    import { db, doc, getDoc, collection, query, where, onSnapshot } from "./firebase-config.js";
    import { getIconeType, formatPrix, escapeHTML } from "./malaga-reference.js";

    const entrepriseId = new URLSearchParams(location.search).get("id");
    const conteneur = document.getElementById("listeBiens");

    if (!entrepriseId) {
      document.getElementById("entNom").textContent = "Profil introuvable";
      conteneur.innerHTML = `<div class="etat-vide"><p>Aucun identifiant d'entreprise fourni.</p></div>`;
    } else {
      chargerEntreprise();
      chargerBiens();
    }

    async function chargerEntreprise() {
      try {
        const snap = await getDoc(doc(db, "users", entrepriseId));
        if (!snap.exists() || snap.data().compteType !== "entreprise") {
          document.getElementById("entNom").textContent = "Profil introuvable";
          return;
        }
        const e = snap.data();
        document.getElementById("entNom").textContent = e.raisonSociale || e.nom || "Entreprise";
        document.title = `${e.raisonSociale || "Entreprise"} — MALAGA`;

        document.getElementById("entLogo").innerHTML = e.logoUrl
          ? `<img src="${escapeHTML(e.logoUrl)}" alt="">` : "🏢";

        if (e.statutEntreprise === "verifie") {
          document.getElementById("entBadgeWrap").innerHTML = `<span class="ent-badge">🏢 Professionnel vérifié</span>`;
        }

        if (e.slogan) {
          const sloganEl = document.getElementById("entSlogan");
          sloganEl.textContent = e.slogan;
          sloganEl.style.display = "block";
        }

        const contactParts = [];
        if (e.entrepriseTel || e.tel) contactParts.push(`📞 ${escapeHTML(e.entrepriseTel || e.tel)}`);
        if (e.entrepriseEmail) contactParts.push(`✉️ ${escapeHTML(e.entrepriseEmail)}`);
        if (e.entrepriseAdresse) contactParts.push(`📍 ${escapeHTML(e.entrepriseAdresse)}`);
        document.getElementById("entContact").innerHTML = contactParts.join(" &nbsp;·&nbsp; ");

        if (typeof e.entrepriseLat === "number" && typeof e.entrepriseLng === "number") {
          afficherLocalisation(e.entrepriseLat, e.entrepriseLng, e.raisonSociale || e.nom || "Nos bureaux", e.entrepriseTel || e.tel);
        }
      } catch (err) {
        console.error(err);
        document.getElementById("entNom").textContent = "Erreur de chargement";
      }
    }

    function afficherLocalisation(lat, lng, nom, telephone) {
      document.getElementById("sectionLocalisation").style.display = "block";

      const carte = L.map("locCarte", { zoomControl: false, dragging: false, scrollWheelZoom: false }).setView([lat, lng], 15);
      L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", { attribution: "© OpenStreetMap" }).addTo(carte);
      L.marker([lat, lng]).addTo(carte).bindPopup(escapeHTML(nom));
      setTimeout(() => carte.invalidateSize(), 150);

      const numero = (telephone || "").replace(/[^\d]/g, "");
      const lienGoogleMaps = `https://www.google.com/maps?q=${lat},${lng}`;
      const lienItineraire = `https://www.google.com/maps/dir/?api=1&destination=${lat},${lng}`;
      const messageWhatsapp = encodeURIComponent(`Bonjour, voici la localisation de nos bureaux « ${nom} » sur MALAGA : ${lienGoogleMaps}`);

      const actions = [
        { href: lienGoogleMaps, icone: "🗺️", label: "Voir sur Google Maps" },
        { href: lienItineraire, icone: "🧭", label: "Itinéraire" }
      ];
      if (numero) actions.push({ href: `https://wa.me/${numero}?text=${messageWhatsapp}`, icone: "💬", label: "Partager via WhatsApp" });

      document.getElementById("locActions").innerHTML = actions.map(a => `
        <a class="loc-btn" href="${a.href}" target="_blank" rel="noopener">
          <span class="icone">${a.icone}</span>${a.label}
        </a>
      `).join("");
    }

    function chargerBiens() {
      const q = query(collection(db, "annonces"), where("proprietaireId", "==", entrepriseId));
      onSnapshot(q, (snap) => {
        const biens = snap.docs.map(d => ({ id: d.id, ...d.data() }));
        document.getElementById("statBiens").textContent = biens.length;
        document.getElementById("statDisponibles").textContent = biens.filter(b => b.statut === "disponible").length;

        if (biens.length === 0) {
          conteneur.innerHTML = `<div class="etat-vide" style="grid-column:1/-1;"><div class="icone">📭</div><p>Aucun bien publié pour le moment.</p></div>`;
          return;
        }

        conteneur.innerHTML = biens.map(b => `
          <div class="mini-carte" data-id="${b.id}">
            <div class="img">${b.photos?.[0] ? `<img src="${escapeHTML(b.photos[0])}" alt="">` : getIconeType(b.type)}</div>
            <div class="corps">
              <h4>${escapeHTML(b.titre || "Annonce")}</h4>
              <div class="prix">${formatPrix(b.prix)}</div>
              <div class="meta">📍 ${escapeHTML(b.quartier || "")}${b.commune ? ", " + escapeHTML(b.commune) : ""} · ${b.statut === "disponible" ? "🟢 Disponible" : "🔴 Occupé"}</div>
              <div class="meta">${b.numeroBien ? "🏷️ " + escapeHTML(b.numeroBien) + " · " : ""}${b.etage && b.etage !== "Non précisé" ? "🪜 " + escapeHTML(b.etage) + " · " : ""}${b.vue && b.vue !== "Non précisé" ? "🌅 " + escapeHTML(b.vue) : ""}</div>
            </div>
          </div>
        `).join("");

        conteneur.querySelectorAll(".mini-carte").forEach(carte => {
          carte.addEventListener("click", () => {
            window.location.href = `index.html?annonce=${carte.dataset.id}`;
          });
        });
      }, () => {
        conteneur.innerHTML = `<div class="etat-vide"><p>Impossible de charger le catalogue.</p></div>`;
      });
    }
  </script>
  <script type="module" src="nav.js"></script>
</body>
</html>
